# Blueprint de Render: servicio web Docker + PostgreSQL. HTTPS lo provee Render.
services:
  - type: web
    name: anemia-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENTORNO
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anemia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGENES
        value: "*"
      - key: DEMO_CONTRASENA   # definir en el panel de Render (sync: false = se pide al crear)
        sync: false
      - key: DEMO_USUARIO
        value: demo

databases:
  - name: anemia-db
    databaseName: anemia
    plan: free
